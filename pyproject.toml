[project]
name = "security-assessment-orchestrator"
version = "0.1.0"
description = "Production-ready cybersecurity portfolio app: security-assessment-orchestrator"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.10.6",
  "pydantic-settings==2.8.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "psycopg[binary]==3.2.4",
  "structlog==24.4.0",
  "python-json-logger==2.0.7",
  "httpx==0.27.2",
  "celery==5.4.0",
  "redis==5.2.0",
  "tenacity==9.0.0",

]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.3",
  "ruff==0.8.4",
  "mypy==1.14.1",
  "types-requests==2.32.0.20241016",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
